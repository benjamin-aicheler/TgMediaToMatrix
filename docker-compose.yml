services:
  telegram-matrix-bridge:
    image: python:3.14-slim
    container_name: tg_matrix_media_bridge
    restart: unless-stopped
    volumes:
      - ./app:/app
      - ./session_data:/app/session
    working_dir: /app
    shm_size: 1g
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg && pip install --no-cache-dir telethon matrix-nio av Pillow blurhash && python bridge.py"
    environment:
      - TG_API_ID=
      - TG_API_HASH=
      - MATRIX_HOMESERVER=
      - MATRIX_ACCESS_TOKEN=
      - MATRIX_ROOM_IDS=
      # - MATRIX_ROOM_ID=  # Deprecated: ignored if MATRIX_ROOM_IDS is set
      - ADMIN_MATRIX_USER_ID=
      - ALLOW_NON_ADMIN_STOP=false
      - TG_CHANNELS=
      - MAX_MEDIA_SIZE_MB=80
      - OVERSIZED_VIDEO_ACTION=split
      - OVERSIZED_VIDEO_MAX_INPUT_MB=250
      - OVERSIZED_VIDEO_FALLBACK_COMPRESS=false
      - VIDEO_COMPRESSION_MAX_HEIGHT=720
      - VIDEO_COMPRESSION_PRESET=veryfast
      - VIDEO_COMPRESSION_CRF=28
      - VIDEO_COMPRESSION_THREADS=2
      - MIN_IMAGE_SIZE_KB=0
      - MIN_VIDEO_SIZE_KB=0
      - ENABLE_IMAGES=true
      - ENABLE_VIDEOS=true
      - DEDUPLICATION_ENABLED=true
      - DEDUPLICATION_TTL_MINUTES=15
      - DEDUPLICATION_CACHE_SIZE=2000
      - LLAMAGUARD_API_URL=
      - LLAMAGUARD_MODEL_NAME=meta-llama/llama-guard-4-12b
      - LLAMAGUARD_API_KEY=
      - LLAMAGUARD_CHECKS=
      - LLAMAGUARD_REQUIRE_CHECKS=
      - LLAMAGUARD_VIDEO_FRAMES=5
      - LLAMAGUARD_RANDOM_FRAMES=true


